  cdGateway:
    name: ctyk-chronic-gateway
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/ctyk-chronic/ctyk-chronic-gateway'
    tag: "1.1.26-r1"  ## TODO: 修改为实际版本号
    port: 19901
  cdAuth:
    name: ctyk-chronic-auth
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/ctyk-chronic/ctyk-chronic-auth'
    tag: "1.1.26-r1"   ## TODO: 修改为实际版本号
    port: 19902
  cdSystem:
    name: ctyk-chronic-system
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/ctyk-chronic/ctyk-chronic-system'
    tag: "1.1.26-r1"   ## TODO: 修改为实际版本号
    port: 19903
  cdBusiness:
    name: ctyk-chronic-business
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/ctyk-chronic/ctyk-chronic-business'
    tag: "1.1.26-r1"   ## TODO: 修改为实际版本号
    port: 19907
