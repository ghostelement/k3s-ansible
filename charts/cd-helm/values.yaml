    name: ctyk-chronic-foreign
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/ctyk-chronic/ctyk-chronic-foreign'
    tag: "1.1.26-r1"   ## TODO: 修改为实际版本号
    port: 19909
  cdJob:
    name: ctyk-chronic-job
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/ctyk-chronic/ctyk-chronic-job'
    tag: "1.1.26-r1"   ## TODO: 修改为实际版本号
    port: 9905
  cdPointmall:
    name: ctyk-chronic-pointmall
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/ctyk-chronic/ctyk-chronic-pointmall'
