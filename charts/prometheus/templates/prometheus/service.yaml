{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.prometheus.name }}
  labels:
    app: {{ .Values.prometheus.name }}
spec:
  type: {{ .Values.prometheus.service.type }}
  ports:
  {{- range $key, $value :=  .Values.prometheus.ports }}
    - port: {{ $value }}
      targetPort: {{ $value}}
      protocol: TCP
      name: {{ $key }}
  {{- end }}
  selector:
    app: {{ .Values.prometheus.name }}

{{- end }}