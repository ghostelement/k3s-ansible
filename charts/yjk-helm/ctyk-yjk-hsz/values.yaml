# 副本数
replicaCount: 1

global:
  ## @param global.imageRegistry Global Docker image registry
  imageRegistry: ""
  ## Optionally specify an array of imagePullSecrets.
  ## Example:
  ## imagePullSecrets:
  ##   - myRegistryKeySecretName
  imagePullSecrets: []

image:
  aggregateHsz:
    name: ctyk-aggregate-hsz
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/smart-hospital/server/ctyk-yjk-middle-aggregate-hsz'
    tag: "v1.7.9-release-tag"   ## TODO: 修改为实际版本号
    port: 20634
  appHsz:
    name: ctyk-app-hsz
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/smart-hospital/server/ctyk-yjk-his-app-hsz'
    tag: "v1.7.9-release-tag"   ## TODO: 修改为实际版本号
    port: 20630
  appNursedoc:
    name: ctyk-app-nursedoc
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/smart-hospital/server/ctyk-yjk-his-app-nursedoc'
    tag: "v1.7.1-release-tag"   ## TODO: 修改为实际版本号
    port: 20631
  businessNursedoc:
    name: ctyk-business-nursedoc
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/smart-hospital/server/ctyk-yjk-middle-business-nursedoc'
    tag: "v1.7.1-release-tag"   ## TODO: 修改为实际版本号
    port: 20632
  businessNurseorder:
    name: ctyk-business-nurseorder
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/smart-hospital/server/ctyk-yjk-middle-business-nurseorder'
    tag: "v1.7.9-release-tag"   ## TODO: 修改为实际版本号
    port: 20633
  jobHsz:
    name: ctyk-job-hsz
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/smart-hospital/server/ctyk-yjk-his-job-hsz'
    tag: "v1.7.4-release-tag"   ## TODO: 修改为实际版本号
    port: 20635

env:
  - name: "TZ"
    value: "Asia/Shanghai"
  - name: PROFILE
    value: "prod"
  - name: JAVA_OPTS
    value: "-server -Xms1G -Xmx1G -Xmn512M"

isGray: "false"  # TODO: 是否为灰度版本,灰度版本会在变量中添加Dyk_gray=true
skywalking:
  enabled: false   #TODO: 开启skywalking，前提是已经部署过skywalking oap服务,否则设为false
nameOverride: ""
fullnameOverride: ""

resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    cpu: 4
    memory: 2Gi

updateStrategy:
  type: RollingUpdate

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

nodeSelector: {}

tolerations: []
