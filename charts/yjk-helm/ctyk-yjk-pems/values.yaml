# 副本数
replicaCount: 1

global:
  ## @param global.imageRegistry Global Docker image registry
  imageRegistry: ""
  ## Optionally specify an array of imagePullSecrets.
  ## Example:
  ## imagePullSecrets:
  ##   - myRegistryKeySecretName
  imagePullSecrets: []

image:
  ipegsApp:
    name: ctyk-ipegs-app-ipegs
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/smart-hospital/server/ctyk-yjk-ipegs-app-ipegs'
    tag: "v1.7.5-release-tag"   ## TODO: 修改为实际版本号
    port: 20480
  ipegsBusiness:
    name: ctyk-middle-business-ipegs
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/smart-hospital/server/ctyk-yjk-middle-business-ipegs'
    tag: "v1.7.5-release-tag"   ## TODO: 修改为实际版本号
    port: 20481
  pemsBusiness:
    name: ctyk-middle-business-pems
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/smart-hospital/server/ctyk-yjk-middle-business-pems'
    tag: "v1.7.5-release-tag"   ## TODO: 修改为实际版本号
    port: 20471
  pemsApp:
    name: ctyk-pems-app-pems
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/smart-hospital/server/ctyk-yjk-pems-app-pems'
    tag: "v1.7.0-release-tag"   ## TODO: 修改为实际版本号
    port: 20470

env:
  - name: "TZ"
    value: "Asia/Shanghai"
  - name: PROFILE
    value: "prod"
  - name: JAVA_OPTS
    value: "-server -Xms1G -Xmx1G -Xmn512M"

isGray: "false"  # TODO: 是否为灰度版本,灰度版本会在变量中添加Dyk_gray=true
skywalking:
  enabled: false   #TODO: 开启skywalking，前提是已经部署过skywalking oap服务,否则设为false
nameOverride: ""
fullnameOverride: ""

resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    cpu: 4
    memory: 2Gi

updateStrategy:
  type: RollingUpdate

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

nodeSelector: {}

tolerations: []
