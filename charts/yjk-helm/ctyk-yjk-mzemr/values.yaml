# 副本数
replicaCount: 1

global:
  ## @param global.imageRegistry Global Docker image registry
  imageRegistry: ""
  ## Optionally specify an array of imagePullSecrets.
  ## Example:
  ## imagePullSecrets:
  ##   - myRegistryKeySecretName
  imagePullSecrets: []

image:
  aggregateMzemr:
    name: ctyk-middle-aggregate-mzemr
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/smart-hospital/server/ctyk-yjk-middle-aggregate-mzemr'
    tag: "v1.7.4-release-tag"   ## TODO: 修改为实际版本号
    port: 20301
  businessMz:
    name: ctyk-middle-business-mz
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/smart-hospital/server/ctyk-yjk-middle-business-mz'
    tag: "v1.7.2-release-tag"   ## TODO: 修改为实际版本号
    port: 20302
  businessMzorder:
    name: ctyk-middle-business-mzorder
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/smart-hospital/server/ctyk-yjk-middle-business-mzorder'
    tag: "v1.7.9-release-tag"   ## TODO: 修改为实际版本号
    port: 20303
  appMzemr:
    name: ctyk-mzemr-app-mzemr
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/smart-hospital/server/ctyk-yjk-mzemr-app-mzemr'
    tag: "v1.7.6-release-tag"   ## TODO: 修改为实际版本号
    port: 20300
  appInfusion:
    name: ctyk-infusion-app-infusion
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/smart-hospital/server/ctyk-yjk-infusion-app-infusion'
    tag: "v1.7.1-release-tag"
    port: 20332
  businessInfusion:
    name: ctyk-middle-business-infusion
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/smart-hospital/server/ctyk-yjk-middle-business-infusion'
    tag: "v1.7.2-release-tag"
    port: 20331
env:
  - name: "TZ"
    value: "Asia/Shanghai"
  - name: PROFILE
    value: "prod"
  - name: JAVA_OPTS
    value: "-server -Xms1G -Xmx1G -Xmn512M"

isGray: "false"  # TODO: 是否为灰度版本,灰度版本会在变量中添加Dyk_gray=true
skywalking:
  enabled: false   #TODO: 开启skywalking，前提是已经部署过skywalking oap服务,否则设为false
nameOverride: ""
fullnameOverride: ""

resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    cpu: 4
    memory: 2Gi

updateStrategy:
  type: RollingUpdate

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

nodeSelector: {}

tolerations: []
