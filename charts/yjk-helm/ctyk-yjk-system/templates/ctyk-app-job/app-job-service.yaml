{{- if eq .Values.isGray "false" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.image.appJob.name }}
  labels:
    {{- include "ctyk-yjk.labels" . | nindent 4 }}
  annotations:
    prometheus.io/port: {{ .Values.image.appJob.port | quote }}  #prometheus监控端口
    prometheus.io/spring: "true"
    prometheus.io/path: "actuator/prometheus"
spec:
  type: NodePort
  ports:
    - port: {{ .Values.image.appJob.port }}
      targetPort: {{ .Values.image.appJob.port }}
      nodePort: {{ .Values.image.appJob.externalPort }}
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.image.appJob.name }}
{{- end }}