{{- if and (eq .Values.service.type "Ingress") (.Values.modules.csess.enabled) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.image.csess.name }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: {{ .Values.service.ingressClassName }}
  rules:
  - host: {{ .Values.service.domain }}
    http:
      paths:
      - path: /csess
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.image.csess.name }}  ## 后端service服务名称
            port:
              number: {{ .Values.image.csess.port }}
      - path: /csess/wss-server
        pathType: Prefix
        backend:
          service:
            name: ctyk-business-csesshis  ## 后端socket server service服务名称
            port:
              number: 20469
        
{{- end }}