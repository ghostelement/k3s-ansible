{{- if .Values.modules.mzcharge.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.image.mzcharge.name }}
  labels:
    {{- include "ctyk-yjk.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.image.mzcharge.port }}
      targetPort: {{ .Values.image.mzcharge.port }}
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.image.mzcharge.name }}
{{- end }}