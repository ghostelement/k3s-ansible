apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.image.businessZyorder.name }}
  labels:
    {{- include "ctyk-yjk.labels" . | nindent 4 }}
  annotations:
    prometheus.io/port: {{ .Values.image.businessZyorder.port | quote }}  #prometheus监控端口
    prometheus.io/spring: "true"
    prometheus.io/path: "actuator/prometheus"
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.image.businessZyorder.port }}
      targetPort: {{ .Values.image.businessZyorder.port }}
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.image.businessZyorder.name }}
