  username: "nacos"
  password: "ctyk@yHJ!Uc45aBn"
  namespace: "ygt"
  host: "nacos.default.svc.cluster.local"
  port: "8848"
  group: "DEFAULT_GROUP"

#TODO: 部署业务模块开关
cdr: true
mdm: true
empi: true
health: true

env:
  - name: "TZ"
    value: "Asia/Shanghai"
  - name: PROFILE
    value: "test"
  - name: JAVA_OPTS
    value: "-server -Xms2G -Xmx2G -Xmn512M"

skywalking:
  enabled: false   #TODO: 开启skywalking，前提是已经部署过skywalking oap服务,否则设为false
nameOverride: ""
fullnameOverride: ""

resources:
  requests:
    cpu: 100m
    memory: 2Gi
  limits:
    cpu: 4
    memory: 3Gi

updateStrategy:
  type: RollingUpdate

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

nodeSelector: {}

tolerations: []
