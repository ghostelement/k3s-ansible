    port: 6016
  ygtSystem:
    name: system-service-model
    repository: 'k3s.harbor:8090/sync/yjk-release-docker/medical-community-unified-portal/system-service-model'
    tag: "v1.2.3-tag"   ## TODO: 修改为实际版本号
