apiVersion: v1
kind: Service
metadata:
  annotations: {}
  labels:
    app: {{ .Values.image.nacos.name }}
  name: {{ .Values.image.nacos.name }}
spec:
  clusterIP:
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: web
      nodePort: 8848
      port: 8848
      protocol: TCP
      targetPort: 8848
    - name: data
      nodePort: 9848
      port: 9848
      protocol: TCP
      targetPort: 9848
  selector:
    app: {{ .Values.image.nacos.name }}
  sessionAffinity: None
  type: NodePort
